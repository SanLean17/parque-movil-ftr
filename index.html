<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil CNRT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #1a252f;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            padding: 20px;
        }
        .badge {
            background-color: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Estado del Parque Móvil - CNRT</h1>
    <div id="status" class="loading">Cargando datos de las líneas...</div>
    
    <table id="tabla-parques" style="display: none;">
        <thead>
            <tr>
                <th>Línea</th>
                <th>N° Empresa / Cód.</th>
                <th>Razón Social / Empresa</th>
                <th>Cantidad de Unidades</th>
            </tr>
        </thead>
        <tbody id="contenido-tabla"></tbody>
    </table>
</div>

<script>
const EMPRESAS_CNRT = {
    2: "2058", 9: "2062", 10: "2008", 15: "67", 17: "2024", 22: "2022", 24: "2005",
    29: "2064", 32: "2048", 33: "972", 37: "2067", 45: "2068", 51: "2079", 53: "2054",
    56: "2013", 60: "2075", 63: "2037", 70: "2080", 74: "2079", 79: "2079", 80: "2015",
    85: "359", 91: "2013", 92: "2023", 95: "2003", 98: "2021", 100: "2042", 113: "2037",
    119: "2068", 126: "2119", 128: "2048", 129: "2033", 133: "2010", 134: "2042",
    135: "2013", 148: "2033", 154: "2068", 158: "2048", 159: "2100", 160: "2101",
    164: "2062", 168: "2105", 177: "2079", 178: "2111", 179: "9085", 180: "2099",
    195: "2077", 197: "2033"
};

async function cargarParques() {
    const tbody = document.getElementById('contenido-tabla');
    const status = document.getElementById('status');
    const tabla = document.getElementById('tabla-parques');
    
    let lineasProcesadas = 0;

    for (const [linea, codEmpresa] of Object.entries(EMPRESAS_CNRT)) {
        try {
            const response = await fetch(`parques/linea${linea}.csv`);
            if (!response.ok) continue;

            const text = await response.text();
            
            // 1. Extraer N° de empresa desde el metadato inyectado o usar el mapeo local
            let nroEmpresa = codEmpresa;
            const matchMeta = text.match(/<!--\s*nro_emp:\s*(\d+)\s*-->/);
            if (matchMeta) {
                nroEmpresa = matchMeta[1];
            }

            // 2. Crear un documento parser para extraer datos del HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');

            // 3. Extraer la Razón Social / Nombre de Empresa
            let razonSocial = "";
            
            // Buscar en selectores o etiquetas del HTML
            const optionSelected = doc.querySelector('select[name="empresa"] option[selected]');
            if (optionSelected && optionSelected.textContent.trim()) {
                razonSocial = optionSelected.textContent.trim();
            } else {
                // Intentar leer la tercera columna de la primera fila de datos si existe tabla
                const primeraFilaTDs = doc.querySelectorAll('table tr td');
                if (primeraFilaTDs.length >= 3) {
                    razonSocial = primeraFilaTDs[2].textContent.trim();
                }
            }

            if (!razonSocial || razonSocial === "") {
                razonSocial = `EMPRESA LÍNEA ${linea}`;
            }

            // 4. Contar la cantidad de unidades/vehículos
            const filasTabla = doc.querySelectorAll('table tr');
            let cantidadCoches = 0;

            if (filasTabla.length > 0) {
                // Descontar la fila de encabezados si existe
                cantidadCoches = Array.from(filasTabla).filter(tr => tr.querySelectorAll('td').length > 0).length;
            } else {
                // Fallback por si la respuesta no tiene estructura tr/td clásica
                const matchesDominios = text.match(/\b[A-Z]{2}\d{3}[A-Z]{2}\b|\b[A-Z]{3}\d{3}\b/gi);
                if (matchesDominios) {
                    cantidadCoches = new Set(matchesDominios.map(d => d.toUpperCase())).size;
                }
            }

            // 5. Agregar la fila a la tabla
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>Línea ${linea}</strong></td>
                <td>${nroEmpresa}</td>
                <td>${razonSocial}</td>
                <td><span class="badge">${cantidadCoches} coches</span></td>
            `;
            tbody.appendChild(tr);
            lineasProcesadas++;

        } catch (e) {
            console.error(`Error cargando línea ${linea}:`, e);
        }
    }

    if (lineasProcesadas > 0) {
        status.style.display = 'none';
        tabla.style.display = 'table';
    } else {
        status.textContent = 'No se encontraron datos cargados en la carpeta /parques.';
    }
}

document.addEventListener('DOMContentLoaded', cargarParques);
</script>

</body>
</html>
