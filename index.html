<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil FTR - Panel General</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Fuente JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        code: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Compacto y Centrado -->
    <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-md py-3 px-4 border-b dark:border-gray-700">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <i class="fa-solid fa-bus-simple text-xl sm:text-2xl text-blue-300"></i>
                <div>
                    <h1 class="text-lg sm:text-2xl font-black uppercase tracking-wider text-white leading-tight">Parque Móvil FTR</h1>
                    <p class="text-blue-200 dark:text-gray-400 text-[10px] sm:text-xs">Sistema de Fiscalización de Transporte</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="bg-blue-800 dark:bg-gray-700 text-yellow-300 dark:text-yellow-400 p-2 sm:px-3 rounded-lg border border-blue-700 dark:border-gray-600 hover:bg-blue-700 dark:hover:bg-gray-600 transition text-xs font-bold flex items-center space-x-1">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                <span id="themeText" class="text-[10px] hidden sm:inline">Oscuro</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-grow w-full">
        
        <!-- Encabezado de Sección + Buscador -->
        <div class="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
                <h2 class="text-base sm:text-xl font-black text-gray-800 dark:text-gray-200 uppercase tracking-wide">Líneas Fiscalizadas</h2>
                <p class="text-[11px] sm:text-xs text-gray-500 dark:text-gray-400">Seleccioná una línea para inspeccionar el estado del parque móvil.</p>
            </div>

            <!-- Buscador Rápido -->
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="lineSearch" onkeyup="filterLines()" placeholder="Buscar línea o empresa..." 
                    class="w-full pl-9 pr-3 py-1.5 sm:py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs font-code shadow-sm">
            </div>
        </div>

        <!-- GRILLA DE TARJETAS COMPACTAS (ADAPTADAS A MOBILE) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4" id="linesGrid">
            <!-- Se generan dinámicamente con JS -->
        </div>

        <div id="noResults" class="hidden text-center py-12 text-gray-400">
            <i class="fa-solid fa-bus text-4xl mb-2 opacity-40"></i>
            <p class="text-sm font-semibold">No se encontraron líneas coincidentes</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-2.5 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>

    <script>
        // Tu lista exacta de líneas ordenadas de menor a mayor
        const lineas = [
            2, 9, 10, 15, 17, 22, 24, 29, 32, 33, 37, 45, 51, 53, 56, 60, 63, 70, 74, 75, 
            79, 80, 85, 91, 92, 98, 100, 113, 119, 126, 128, 129, 133, 134, 135, 148, 154, 
            158, 159, 160, 164, 168, 177, 178, 179, 180, 195, 197
        ].sort((a, b) => a - b);

        const grid = document.getElementById("linesGrid");

        // Helper para leer propiedades ignorando mayúsculas/minúsculas
        function getProp(obj, names) {
            const keys = Object.keys(obj);
            for (let name of names) {
                const found = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
                if (found && obj[found] !== null && obj[found] !== undefined) return String(obj[found]).trim();
            }
            return '';
        }

        // Construir las tarjetas con el formato visual y compacto original
        lineas.forEach(id => {
            const card = document.createElement("div");
            card.className = "line-card bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:border-blue-500 dark:hover:border-blue-500 transition overflow-hidden flex flex-col justify-between";
            card.setAttribute("data-linea", id);

            card.innerHTML = `
                <div class="p-3.5 sm:p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-blue-900 text-white dark:bg-blue-800 text-xs sm:text-sm font-black px-2.5 py-1 rounded-md font-code tracking-wide">
                                LÍNEA ${id}
                            </span>
                        </div>
                        <i class="fa-solid fa-bus text-gray-300 dark:text-gray-600 text-lg sm:text-xl"></i>
                    </div>

                    <h3 class="text-xs font-bold text-gray-700 dark:text-gray-300 truncate tracking-tight uppercase mb-1" id="empresa-${id}">
                        Cargando empresa...
                    </h3>

                    <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium">
                        Jurisdicción / Parque Nacional y Provincial
                    </p>
                </div>

                <div class="bg-gray-50 dark:bg-gray-800/80 px-3.5 py-2.5 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center mt-auto">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="text-[10px] font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider">Activa</span>
                    </div>

                    <a href="linea.html?id=${id}" class="bg-blue-800 hover:bg-blue-900 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center space-x-1 shadow-sm">
                        <span>Ver Parque</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </a>
                </div>
            `;

            grid.appendChild(card);
            fetchEmpresaName(id);
        });

        // Extraer nombre de la empresa desde parques/linea[N].csv
        function fetchEmpresaName(id) {
            Papa.parse(`parques/linea${id}.csv`, {
                download: true,
                header: true,
                skipEmptyLines: true,
                preview: 5,
                complete: function(results) {
                    const el = document.getElementById(`empresa-${id}`);
                    if (results && results.data && results.data.length > 0) {
                        let emp = getProp(results.data[0], ['empresa', 'razonsocial', 'razon_social', 'nombre_empresa', 'empresa_nombre', 'razonSocial']);
                        if (emp) {
                            el.textContent = emp;
                        } else {
                            el.textContent = `EMPRESA LÍNEA ${id}`;
                        }
                    } else {
                        el.textContent = `EMPRESA LÍNEA ${id}`;
                    }
                },
                error: function() {
                    const el = document.getElementById(`empresa-${id}`);
                    if(el) el.textContent = `EMPRESA LÍNEA ${id}`;
                }
            });
        }

        // Búsqueda en tiempo real (por número o por nombre de empresa)
        function filterLines() {
            const query = document.getElementById("lineSearch").value.trim().toLowerCase();
            const cards = document.querySelectorAll(".line-card");
            let visibleCount = 0;

            cards.forEach(card => {
                const num = card.getAttribute("data-linea");
                const empEl = card.querySelector("h3");
                const empText = empEl ? empEl.textContent.toLowerCase() : "";

                if (num.includes(query) || `linea ${num}`.includes(query) || empText.includes(query)) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            const noResults = document.getElementById("noResults");
            if (visibleCount === 0) {
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
            }
        }

        // Modo Oscuro
        function toggleDarkMode() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-sm';
                themeText.textContent = 'Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-sm';
                themeText.textContent = 'Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-sm';
            document.getElementById('themeText').textContent = 'Claro';
        }
    </script>
</body>
</html>
