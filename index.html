<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil FTR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans text-gray-800">

    <!-- Header Compacto -->
    <header class="bg-blue-900 text-white shadow-md py-3 px-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bus text-yellow-400 text-xl"></i>
                <div>
                    <h1 class="text-lg md:text-xl font-extrabold leading-tight">Parque Móvil FTR</h1>
                    <p class="text-blue-200 text-xs hidden sm:block">Control y Fiscalización de Transporte</p>
                </div>
            </div>
            <span class="bg-blue-800 text-blue-200 text-[10px] sm:text-xs px-2.5 py-1 rounded-full border border-blue-700 font-semibold">
                <i class="fa-solid fa-shield-halved mr-1"></i> Flotas
            </span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 flex-grow w-full">

        <!-- Buscador -->
        <div class="mb-3 bg-white p-2.5 rounded-lg shadow-sm border border-gray-200">
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Buscar por Línea o Razón Social..." 
                    class="w-full pl-9 pr-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs sm:text-sm">
            </div>
        </div>

        <!-- Tabla Principal Compacta -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="companiesTable">
                    <thead>
                        <tr class="bg-gray-800 text-white text-[11px] sm:text-xs uppercase tracking-wider text-center">
                            <th class="py-2 px-2 font-semibold text-left">N° Emp.</th>
                            <th class="py-2 px-2 font-semibold text-center">LÍNEA</th>
                            <th class="py-2 px-2 font-semibold text-left">RAZÓN SOCIAL</th>
                            <th class="py-2 px-1 font-semibold leading-tight">Unidades<br>Totales</th>
                            <th class="py-2 px-1 font-semibold leading-tight">Unidades<br>Controladas</th>
                            <th class="py-2 px-1 font-semibold leading-tight">%<br>Fiscaliz.</th>
                            <th class="py-2 px-1 font-semibold leading-tight">Última<br>Visita</th>
                            <th class="py-2 px-2 font-semibold">Acción</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-xs sm:text-sm font-medium">
                        
                        <!-- FILA DEMO: LÍNEA 22 -->
                        <tr class="hover:bg-blue-50 transition">
                            <td class="py-2.5 px-2 font-bold text-gray-900">102</td>
                            <td class="py-2.5 px-2 text-center">
                                <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold text-xs">22</span>
                            </td>
                            <td class="py-2.5 px-2 font-semibold text-gray-800 whitespace-nowrap">Línea 22 S.A.T.A.</td>
                            <td class="py-2.5 px-1 text-center font-bold">18</td>
                            <td class="py-2.5 px-1 text-center text-green-600 font-bold">15</td>
                            <td class="py-2.5 px-1 text-center">
                                <span class="font-bold text-blue-900 text-xs">83.3%</span>
                            </td>
                            <td class="py-2.5 px-1 text-center text-gray-600 text-xs whitespace-nowrap">01/09/2026</td>
                            <td class="py-2.5 px-2 text-center">
                                <a href="linea22.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-[11px] px-2.5 py-1 rounded transition font-semibold shadow-sm whitespace-nowrap">
                                    Ver Flota <i class="fa-solid fa-chevron-right text-[9px] ml-0.5"></i>
                                </a>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer Compacto -->
    <footer class="bg-gray-800 text-gray-400 py-2.5 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>

    <!-- Script de búsqueda -->
    <script>
        function filterTable() {
            let input = document.getElementById("searchInput");
            let filter = input.value.toUpperCase();
            let table = document.getElementById("companiesTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let tdLinea = tr[i].getElementsByTagName("td")[1];
                let tdRazon = tr[i].getElementsByTagName("td")[2];
                if (tdLinea || tdRazon) {
                    let txtLinea = tdLinea.textContent || tdLinea.innerText;
                    let txtRazon = tdRazon.textContent || tdRazon.innerText;
                    if (txtLinea.toUpperCase().indexOf(filter) > -1 || txtRazon.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>

</body>
</html>
