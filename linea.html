<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil FTR</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <!-- Fuente JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        code: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Centrado -->
    <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-md py-3 px-4 border-b dark:border-gray-700 relative">
        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <a href="index.html"
               class="bg-blue-800 hover:bg-blue-700 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-2 rounded-lg text-white transition text-sm font-bold flex items-center space-x-2 shadow-sm">
                <i class="fa-solid fa-arrow-left text-base"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>

            <div class="text-center flex-grow mx-2">
                <h1 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-white leading-tight"
                    id="lineaTitle">
                    LÍNEA --
                </h1>

                <p class="text-blue-200 dark:text-gray-400 text-[11px] hidden sm:block">
                    Parque Móvil Oficial
                </p>
            </div>

            <button onclick="toggleDarkMode()"
                    class="bg-blue-800 dark:bg-gray-700 text-yellow-300 dark:text-yellow-400 p-2 sm:px-3 rounded-lg border border-blue-700 dark:border-gray-600 hover:bg-blue-700 dark:hover:bg-gray-600 transition text-xs font-bold flex items-center space-x-1">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                <span id="themeText" class="text-[10px] hidden sm:inline">Oscuro</span>
            </button>

        </div>
    </header>


    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 flex-grow w-full">

        <!-- Tarjetas de Filtro Rápido -->
        <div class="grid grid-cols-3 gap-2 mb-3">

            <button onclick="setFilter('ALL')"
                    id="btnFilterAll"
                    class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border-2 border-sky-500 ring-2 ring-sky-200 dark:ring-sky-900 text-center transition cursor-pointer">

                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">
                    Total
                </p>

                <p class="text-base sm:text-lg font-black text-blue-900 dark:text-blue-300"
                   id="countTotal">
                    0
                </p>

            </button>


            <button onclick="setFilter('CONTROLADO')"
                    id="btnFilterControlado"
                    class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center transition cursor-pointer">

                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">
                    Controlados
                </p>

                <p class="text-base sm:text-lg font-black text-green-600 dark:text-green-400"
                   id="countControlados">
                    0
                </p>

            </button>


            <button onclick="setFilter('PENDIENTE')"
                    id="btnFilterPendiente"
                    class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center transition cursor-pointer">

                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">
                    Pendientes
                </p>

                <p class="text-base sm:text-lg font-black text-gray-600 dark:text-gray-300"
                   id="countPendientes">
                    0
                </p>

            </button>

        </div>


        <!-- Buscador + Copiar -->
        <div class="mb-3 bg-white dark:bg-gray-800 p-2.5 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row gap-2 justify-between items-center">

            <div class="relative w-full sm:w-80">

                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>

                <input type="text"
                       id="searchInput"
                       onkeyup="applyFilters()"
                       placeholder="Buscar por Interno o Patente..."
                       class="w-full pl-9 pr-3 py-1.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs font-code">

            </div>


            <button onclick="copyMissing()"
                    class="w-full sm:w-auto bg-blue-800 hover:bg-blue-900 text-white text-xs px-3 py-2 rounded-md font-semibold transition flex items-center justify-center space-x-1 shadow-sm">

                <i class="fa-regular fa-copy"></i>

                <span>
                    Copiar Faltantes
                </span>

            </button>

        </div>


        <!-- Tabla -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm overflow-hidden border border-gray-200 dark:border-gray-700">

            <div class="overflow-x-auto">

                <table class="w-full text-left border-collapse" id="fleetTable">

                    <thead>

                        <tr class="bg-gray-800 dark:bg-gray-950 text-white text-[11px] sm:text-xs uppercase tracking-wider text-center divide-x divide-gray-700">

                            <th class="py-2.5 px-2 font-semibold">
                                DOMINIO
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                INTERNO
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                MODELO (AÑO)
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                HABILITADO HASTA
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                TÉCNICA VIGENTE HASTA
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                N° TÉCNICA
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                ÚLTIMA FISCALIZACIÓN
                            </th>

                            <th class="py-2.5 px-2 font-semibold">
                                ESTADO
                            </th>

                        </tr>

                    </thead>


                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-xs font-medium"
                           id="fleetTbody">

                        <tr>

                            <td colspan="8"
                                class="py-6 text-center text-gray-500">
                                Cargando datos...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-2.5 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>


    <!-- Script de cruce automático -->
    <script>

        const urlParams = new URLSearchParams(window.location.search);

        const lineaId = urlParams.get('id') || '22';

        document.getElementById("lineaTitle").textContent = `LÍNEA ${lineaId}`;


        let mapControlados = {};

        let currentStatusFilter = 'ALL';


        // ============================================================
        // FORMATEAR FECHA DE FISCALIZACIÓN
        // ============================================================
        // Convierte:
        //
        // 2026-04-09 00:00:00
        //
        // en:
        //
        // 09/04/2026
        //
        // La hora se elimina completamente.
        // ============================================================

        function formatearFechaFiscalizacion(fechaStr) {

            if (!fechaStr) return '';

            let texto = String(fechaStr).trim();

            if (!texto || texto === '-') return '';

            // --------------------------------------------------------
            // Formato YYYY-MM-DD HH:MM:SS
            // --------------------------------------------------------

            let match = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);

            if (match) {

                const año = match[1];
                const mes = match[2];
                const dia = match[3];

                return `${dia}/${mes}/${año}`;
            }


            // --------------------------------------------------------
            // Formato YYYY-MM-DD
            // --------------------------------------------------------

            match = texto.match(/^(\d{4})-(\d{2})-(\d{2})$/);

            if (match) {

                const año = match[1];
                const mes = match[2];
                const dia = match[3];

                return `${dia}/${mes}/${año}`;
            }


            // --------------------------------------------------------
            // Formato DD/MM/YYYY
            // --------------------------------------------------------

            match = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})/);

            if (match) {

                const dia = match[1];
                const mes = match[2];
                const año = match[3];

                return `${dia}/${mes}/${año}`;
            }


            // --------------------------------------------------------
            // Si no reconoce el formato, elimina solamente la hora
            // como medida de seguridad.
            // --------------------------------------------------------

            return texto.split(' ')[0];
        }


        // 1. Cargar archivo de controlados con detección automática de separador

        Papa.parse(`controlados/linea${lineaId}.csv`, {

            download: true,

            header: false,

            skipEmptyLines: true,

            complete: function(results) {

                if (results && results.data) {

                    results.data.forEach(row => {

                        let lineStr = Array.isArray(row)
                            ? row.join(" ")
                            : String(row);

                        let parts = lineStr.trim().split(/\s+/);

                        if (parts.length >= 2) {

                            let fecha = parts[0];

                            let dominio = parts[1].toUpperCase();

                            // Guardamos la fecha original para el cruce.
                            mapControlados[dominio] = fecha;

                        }

                    });

                }

                cargarParqueOficial();

            },

            error: function() {

                cargarParqueOficial();

            }

        });


        // 2. Cargar parque oficial sin forzar un delimitador único
        // Auto-detecta ; o ,

        function cargarParqueOficial() {

            Papa.parse(`parques/linea${lineaId}.csv`, {

                download: true,

                header: true,

                dynamicTyping: true,

                skipEmptyLines: true,

                complete: function(results) {

                    if (results &&
                        results.data &&
                        results.data.length > 0) {

                        renderFleet(results.data);

                    } else {

                        document.getElementById("fleetTbody").innerHTML =
                            `<tr>
                                <td colspan="8"
                                    class="py-6 text-center text-red-500 font-bold">
                                    El archivo 'parques/linea${lineaId}.csv' está vacío.
                                </td>
                            </tr>`;

                    }

                },

                error: function(err) {

                    document.getElementById("fleetTbody").innerHTML =
                        `<tr>
                            <td colspan="8"
                                class="py-6 text-center text-red-500 font-bold">
                                No se pudo cargar 'parques/linea${lineaId}.csv'.
                                Verifica que el archivo exista en la carpeta.
                            </td>
                        </tr>`;

                }

            });

        }


        // Helper para buscar nombres de propiedades
        // sin importar mayúsculas o minúsculas

        function getProp(obj, names) {

            const keys = Object.keys(obj);

            for (let name of names) {

                const found = keys.find(
                    k => k.trim().toLowerCase() === name.toLowerCase()
                );

                if (found &&
                    obj[found] !== null &&
                    obj[found] !== undefined) {

                    return String(obj[found]).trim();

                }

            }

            return '';

        }


        function renderFleet(data) {

            data.sort((a, b) => {

                let intA =
                    parseInt(
                        getProp(a, ['interno', 'int', 'unidad'])
                    ) || 0;

                let intB =
                    parseInt(
                        getProp(b, ['interno', 'int', 'unidad'])
                    ) || 0;

                return intA - intB;

            });


            let tbody =
                document.getElementById("fleetTbody");

            tbody.innerHTML = "";


            let total = 0;

            let countControlados = 0;

            let countPendientes = 0;


            const hoy =
                new Date().toISOString().split('T')[0];


            data.forEach(item => {

                let dominioCSV =
                    getProp(
                        item,
                        ['dominio', 'patente', 'dominio_vehiculo']
                    ).toUpperCase();


                let internoVal =
                    getProp(
                        item,
                        ['interno', 'int', 'unidad']
                    );


                if (!dominioCSV && !internoVal) return;


                total++;


                // Fecha original para determinar si está controlado

                let fechaFiscalizacion =
                    mapControlados[dominioCSV] || null;


                let isControlado =
                    !!fechaFiscalizacion;


                if (isControlado)

                    countControlados++;

                else

                    countPendientes++;


                let statusText =
                    isControlado
                        ? "CONTROLADO"
                        : "PENDIENTE";


                let rowBg =
                    isControlado
                        ? ""
                        : "bg-slate-50 dark:bg-gray-800/60";


                let marca =
                    getProp(
                        item,
                        ['chasismarca', 'marca']
                    );


                let modelo =
                    getProp(
                        item,
                        ['chasismodelo', 'modelo']
                    );


                let anio =
                    getProp(
                        item,
                        ['aniomodelo', 'anio', 'año']
                    );


                let modeloText =
                    `${marca} ${modelo} (${anio})`.trim();


                if (modeloText === "()")

                    modeloText = "-";


                let habHasta =
                    getProp(
                        item,
                        ['vigenciahasta', 'habilitacion']
                    );


                habHasta =
                    habHasta
                        ? habHasta.replace("UC:", "")
                        : "-";


                let tecFecha =
                    getProp(
                        item,
                        [
                            'vigenciahastainspecciontecnica',
                            'tecnica',
                            'vvt'
                        ]
                    ) || "-";


                let tecBadgeClass =
                    "bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300";


                if (tecFecha !== "-") {

                    let parts =
                        tecFecha.split("/");


                    if (parts.length === 3) {

                        let formattedFecha =
                            `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;


                        if (formattedFecha < hoy) {

                            tecBadgeClass =
                                "bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-300";

                        } else {

                            tecBadgeClass =
                                "bg-green-100 text-green-800 dark:bg-green-900/60 dark:text-green-300";

                        }

                    }

                }


                let tecNro =
                    getProp(
                        item,
                        ['tecnicanro', 'nrotecnica', 'nro_tecnica']
                    ) || "-";


                // ====================================================
                // CAMBIO:
                // La fecha se muestra solamente como DD/MM/YYYY.
                // ====================================================

                let fechaFiscalizacionMostrar =
                    formatearFechaFiscalizacion(
                        fechaFiscalizacion
                    );


                let tr =
                    document.createElement("tr");


                tr.className =
                    `hover:bg-blue-50 dark:hover:bg-gray-700 transition divide-x divide-gray-200 dark:divide-gray-700 text-center ${rowBg}`;


                tr.setAttribute(
                    "data-status",
                    statusText
                );


                tr.innerHTML = `

                    <td class="py-2.5 px-2 font-extrabold text-gray-900 dark:text-gray-100 font-code text-sm tracking-wider">
                        ${dominioCSV || '-'}
                    </td>

                    <td class="py-2.5 px-2 font-extrabold text-blue-900 dark:text-blue-300 font-code text-base">
                        ${internoVal || '-'}
                    </td>

                    <td class="py-2.5 px-2 text-gray-700 dark:text-gray-300">
                        ${modeloText}
                    </td>

                    <td class="py-2.5 px-2 text-gray-600 dark:text-gray-400 font-code">
                        ${habHasta}
                    </td>

                    <td class="py-2.5 px-2">
                        <span class="${tecBadgeClass} px-2 py-0.5 rounded font-bold text-[10px] font-code">
                            ${tecFecha}
                        </span>
                    </td>

                    <td class="py-2.5 px-2 text-gray-600 dark:text-gray-400 font-code">
                        ${tecNro}
                    </td>

                    <td class="py-2.5 px-2 font-bold text-gray-800 dark:text-gray-200 font-code">
                        ${
                            fechaFiscalizacionMostrar
                                ? fechaFiscalizacionMostrar
                                : '<span class="text-gray-400 font-normal italic font-sans">-</span>'
                        }
                    </td>

                    <td class="py-2.5 px-2">

                        <span class="${
                            isControlado
                                ? 'bg-green-600 text-white'
                                : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300'
                        } px-2 py-0.5 rounded-full font-bold text-[10px]">

                            ${statusText}

                        </span>

                    </td>

                `;


                tbody.appendChild(tr);

            });


            document.getElementById("countTotal").textContent =
                total;

            document.getElementById("countControlados").textContent =
                countControlados;

            document.getElementById("countPendientes").textContent =
                countPendientes;

        }


        function setFilter(status) {

            currentStatusFilter = status;


            const btnAll =
                document.getElementById('btnFilterAll');

            const btnCtrl =
                document.getElementById('btnFilterControlado');

            const btnPend =
                document.getElementById('btnFilterPendiente');


            const activeClasses = [
                'border-2',
                'border-sky-500',
                'ring-2',
                'ring-sky-200',
                'dark:ring-sky-900'
            ];


            const inactiveClasses = [
                'border',
                'border-gray-200',
                'dark:border-gray-700'
            ];


            // Limpiar todas las tarjetas

            [btnAll, btnCtrl, btnPend].forEach(btn => {

                btn.classList.remove(...activeClasses);

                btn.classList.add(...inactiveClasses);

            });


            // Resaltar la tarjeta activa

            let activeBtn = btnAll;


            if (status === 'CONTROLADO')

                activeBtn = btnCtrl;


            if (status === 'PENDIENTE')

                activeBtn = btnPend;


            activeBtn.classList.remove(
                ...inactiveClasses
            );


            activeBtn.classList.add(
                ...activeClasses
            );


            applyFilters();

        }


        function applyFilters() {

            let searchInput =
                document.getElementById("searchInput")
                .value
                .toUpperCase();


            let tr =
                document.querySelectorAll(
                    "#fleetTbody tr"
                );


            tr.forEach(row => {

                let status =
                    row.getAttribute('data-status');


                if (!status) return;


                let dominio =
                    row
                        .getElementsByTagName("td")[0]
                        .textContent
                        .toUpperCase();


                let interno =
                    row
                        .getElementsByTagName("td")[1]
                        .textContent
                        .toUpperCase();


                let matchesSearch =
                    (
                        dominio.indexOf(searchInput) > -1 ||
                        interno.indexOf(searchInput) > -1
                    );


                let matchesStatus =
                    (
                        currentStatusFilter === 'ALL' ||
                        status === currentStatusFilter
                    );


                if (
                    matchesSearch &&
                    matchesStatus
                )

                    row.style.display = "";

                else

                    row.style.display = "none";

            });

        }


        function copyMissing() {

            let missingInternos = [];


            let tr =
                document.querySelectorAll(
                    "#fleetTbody tr[data-status='PENDIENTE']"
                );


            tr.forEach(row => {

                let interno =
                    row
                        .getElementsByTagName("td")[1]
                        .textContent
                        .trim();


                let dominio =
                    row
                        .getElementsByTagName("td")[0]
                        .textContent
                        .trim();


                missingInternos.push(
                    `• Int. ${interno} (${dominio})`
                );

            });


            if (missingInternos.length === 0) {

                alert(
                    "¡Excelente! No hay colectivos pendientes de control en esta línea."
                );

                return;

            }


            let textToCopy =
                `*LÍNEA ${lineaId} - PENDIENTES DE CONTROL (${missingInternos.length} unidades):*\n`
                +
                missingInternos.join("\n");


            navigator.clipboard
                .writeText(textToCopy)

                .then(() => {

                    alert(
                        "¡Copiado al portapapeles!\n\n"
                        +
                        textToCopy
                    );

                })

                .catch(err => {

                    alert(
                        "Error al copiar: "
                        +
                        err
                    );

                });

        }


        function toggleDarkMode() {

            const html =
                document.documentElement;


            const themeIcon =
                document.getElementById(
                    'themeIcon'
                );


            const themeText =
                document.getElementById(
                    'themeText'
                );


            if (html.classList.contains('dark')) {

                html.classList.remove('dark');


                themeIcon.className =
                    'fa-solid fa-moon text-sm';


                themeText.textContent =
                    'Oscuro';


                localStorage.setItem(
                    'theme',
                    'light'
                );

            } else {

                html.classList.add('dark');


                themeIcon.className =
                    'fa-solid fa-sun text-sm';


                themeText.textContent =
                    'Claro';


                localStorage.setItem(
                    'theme',
                    'dark'
                );

            }

        }


        if (
            localStorage.getItem('theme') === 'dark'
            ||
            (
                !('theme' in localStorage)
                &&
                window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches
            )
        ) {

            document.documentElement.classList.add(
                'dark'
            );


            document.getElementById(
                'themeIcon'
            ).className =
                'fa-solid fa-sun text-sm';


            document.getElementById(
                'themeText'
            ).textContent =
                'Claro';

        }

    </script>

</body>
</html>
