name: Actualizador de Parques CNRT

on:
  schedule:
    # Se ejecuta automáticamente el día 1 y 15 de cada mes a las 03:00 UTC
    - cron: '0 3 1,15 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías y Navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests playwright
          playwright install chromium

      - name: Descargar parques oficiales de CNRT
        run: |
          python scraper.py

      - name: Filtrar y separar por línea
        run: |
          python actualizar_parques.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parques/*.csv controlados/*.csv
          git diff --staged --quiet || git commit -m "Bot: Actualización de parques y filtrado por línea"
          git push
