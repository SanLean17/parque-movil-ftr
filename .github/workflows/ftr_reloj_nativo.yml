name: FTR - Reloj automático
run-name: FTR · reloj · ${{ inputs.mode }} · paso ${{ inputs.step }} · intento ${{ inputs.retry }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prueba finita sin fuentes o activar la agenda real
        type: choice
        options: [prueba, real]
        default: prueba
        required: true
      step:
        description: Paso de la prueba (la activación inicial usa 0)
        type: string
        default: '0'
      retry:
        description: Reintento interno (la activación inicial usa 0)
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  FTR_NATIVE_ENABLED: ${{ vars.FTR_NATIVE_CLOCK_ENABLED }}
  FTR_CLOCK_MODE: ${{ inputs.mode }}
  FTR_CLOCK_STEP: ${{ inputs.step }}
  FTR_CLOCK_RETRY: ${{ inputs.retry }}
jobs:
  preparar:
    if: github.repository == 'SanLean17/parque-movil-ftr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.agenda.outputs.armed }}
      environment: ${{ steps.agenda.outputs.environment }}
      minutes: ${{ steps.agenda.outputs.minutes }}
      armed_utc: ${{ steps.agenda.outputs.armed_utc }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Preparar próxima espera sin leer fuentes
        id: agenda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FTR_CLOCK_PHASE: prepare
        run: python3 -m _ftr_runtime.native_clock
  despertar:
    needs: preparar
    if: needs.preparar.outputs.armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # La nueva espera reemplaza solo este job. La renovación del ciclo anterior
    # puede terminar, sin cancelarse a sí misma al solicitar el siguiente ciclo.
    concurrency:
      group: ftr-reloj-espera-${{ inputs.mode }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    environment:
      name: ${{ needs.preparar.outputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Comprobar la agenda vigente después de la espera
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FTR_CLOCK_PHASE: wake
          FTR_CLOCK_ARMED: ${{ needs.preparar.outputs.armed_utc }}
          FTR_CLOCK_MINUTES: ${{ needs.preparar.outputs.minutes }}
        run: python3 -m _ftr_runtime.native_clock
  renovar:
    needs: [preparar, despertar]
    if: always() && !cancelled() && github.repository == 'SanLean17/parque-movil-ftr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Solicitar directamente el siguiente ciclo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FTR_CLOCK_PHASE: renew
          FTR_PREPARE_RESULT: ${{ needs.preparar.result }}
          FTR_WAKE_RESULT: ${{ needs.despertar.result }}
        run: python3 -m _ftr_runtime.native_clock
