<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil FTR - Panel General</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Fuente JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        code: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header ultra compacto para Mobile -->
    <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-md py-2.5 px-3 border-b dark:border-gray-700">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bus-simple text-lg text-blue-300"></i>
                <div>
                    <h1 class="text-base sm:text-xl font-black uppercase tracking-wider text-white leading-tight">Parque Móvil FTR</h1>
                    <p class="text-blue-200 dark:text-gray-400 text-[9px] sm:text-xs">Fiscalización de Transporte</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="bg-blue-800 dark:bg-gray-700 text-yellow-300 dark:text-yellow-400 p-1.5 sm:px-2.5 rounded-lg border border-blue-700 dark:border-gray-600 hover:bg-blue-700 dark:hover:bg-gray-600 transition text-xs font-bold flex items-center space-x-1">
                <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
                <span id="themeText" class="text-[10px] hidden sm:inline">Oscuro</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-2.5 sm:px-4 py-3 sm:py-5 flex-grow w-full">
        
        <!-- Buscador Rápido -->
        <div class="mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
                <h2 class="text-sm sm:text-lg font-black text-gray-800 dark:text-gray-200 uppercase tracking-wide">Líneas Fiscalizadas</h2>
            </div>

            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="lineSearch" onkeyup="filterLines()" placeholder="Buscar línea o empresa..." 
                    class="w-full pl-8 pr-3 py-1.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs font-code shadow-sm">
            </div>
        </div>

        <!-- GRILLA CON ESTADÍSTICAS COMPACTAS EN COLUMNAS MULTILÍNEA -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="linesGrid">
            <!-- Se generan dinámicamente con JS -->
        </div>

        <div id="noResults" class="hidden text-center py-10 text-gray-400">
            <i class="fa-solid fa-bus text-3xl mb-1 opacity-40"></i>
            <p class="text-xs font-semibold">No se encontraron líneas coincidentes</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-2 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>

    <script>
        // Lista ordenada numéricamente
        const lineas = [
            2, 9, 10, 15, 17, 22, 24, 29, 32, 33, 37, 45, 51, 53, 56, 60, 63, 70, 74, 75, 
            79, 80, 85, 91, 92, 98, 100, 113, 119, 126, 128, 129, 133, 134, 135, 148, 154, 
            158, 159, 160, 164, 168, 177, 178, 179, 180, 195, 197
        ].sort((a, b) => a - b);

        const grid = document.getElementById("linesGrid");

        function getProp(obj, names) {
            const keys = Object.keys(obj);
            for (let name of names) {
                const found = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
                if (found && obj[found] !== null && obj[found] !== undefined) return String(obj[found]).trim();
            }
            return '';
        }

        // Construir cada tarjeta con métricas en columnas compactas (títulos en 2 líneas)
        lineas.forEach(id => {
            const card = document.createElement("div");
            card.className = "line-card bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:border-blue-500 transition overflow-hidden flex flex-col justify-between";
            card.setAttribute("data-linea", id);

            card.innerHTML = `
                <div class="p-3">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="bg-blue-900 text-white dark:bg-blue-800 text-xs font-black px-2 py-0.5 rounded font-code tracking-wide">
                            LÍNEA ${id}
                        </span>
                        <a href="linea.html?id=${id}" class="bg-blue-800 hover:bg-blue-900 text-white text-[11px] px-2.5 py-1 rounded-md font-bold transition flex items-center space-x-1 shadow-sm">
                            <span>Ingresar</span>
                            <i class="fa-solid fa-chevron-right text-[9px]"></i>
                        </a>
                    </div>

                    <h3 class="text-xs font-bold text-gray-800 dark:text-gray-200 truncate uppercase mb-2" id="empresa-${id}">
                        Cargando empresa...
                    </h3>

                    <!-- BARRA DE TITULOS Y MÉTRICAS COMPACTAS -->
                    <div class="grid grid-cols-3 gap-1 bg-gray-50 dark:bg-gray-700/50 p-2 rounded-lg border border-gray-100 dark:border-gray-700 text-center">
                        <!-- Columna 1: Total Unidades -->
                        <div class="flex flex-col justify-center border-r border-gray-200 dark:border-gray-600 pr-1">
                            <span class="text-[9px] leading-tight font-bold text-gray-500 dark:text-gray-400 uppercase">
                                Total<br>Parque
                            </span>
                            <span class="text-xs font-black font-code text-gray-800 dark:text-gray-100 mt-1" id="total-${id}">-</span>
                        </div>

                        <!-- Columna 2: Unidades Controladas -->
                        <div class="flex flex-col justify-center border-r border-gray-200 dark:border-gray-600 px-1">
                            <span class="text-[9px] leading-tight font-bold text-green-600 dark:text-green-400 uppercase">
                                Unidades<br>Controladas
                            </span>
                            <span class="text-xs font-black font-code text-green-700 dark:text-green-300 mt-1" id="controladas-${id}">-</span>
                        </div>

                        <!-- Columna 3: Pendientes / Sin Control -->
                        <div class="flex flex-col justify-center pl-1">
                            <span class="text-[9px] leading-tight font-bold text-amber-600 dark:text-amber-400 uppercase">
                                Sin<br>Controlar
                            </span>
                            <span class="text-xs font-black font-code text-amber-700 dark:text-amber-300 mt-1" id="pendientes-${id}">-</span>
                        </div>
                    </div>
                </div>
            `;

            grid.appendChild(card);
            cargarDatosLinea(id);
        });

        // Carga y cruce de datos CSV (Parque vs Controlados)
        function cargarDatosLinea(id) {
            let totalParque = 0;
            let controladasCount = 0;

            // 1. Cargar el parque móvil
            Papa.parse(`parques/linea${id}.csv`, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(resParque) {
                    if (resParque && resParque.data) {
                        const parqueData = resParque.data;
                        totalParque = parqueData.length;
                        document.getElementById(`total-${id}`).textContent = totalParque;

                        // Extraer empresa
                        if (totalParque > 0) {
                            let emp = getProp(parqueData[0], ['empresa', 'razonsocial', 'razon_social', 'nombre_empresa', 'empresa_nombre', 'razonSocial']);
                            document.getElementById(`empresa-${id}`).textContent = emp || `EMPRESA LÍNEA ${id}`;
                        } else {
                            document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                        }

                        // 2. Cargar inspecciones controladas
                        Papa.parse(`controlados/linea${id}_control.csv`, {
                            download: true,
                            header: true,
                            skipEmptyLines: true,
                            complete: function(resControl) {
                                if (resControl && resControl.data) {
                                    const controlData = resControl.data;
                                    
                                    // Obtener dominios únicos de fiscalización
                                    const dominiosControlados = new Set();
                                    controlData.forEach(row => {
                                        let dom = getProp(row, ['dominio', 'patente', 'carroceria_dominio', 'dominos']);
                                        if (dom) dominiosControlados.add(dom.toUpperCase());
                                    });

                                    controladasCount = dominiosControlados.size;
                                    document.getElementById(`controladas-${id}`).textContent = controladasCount;

                                    const pendientes = Math.max(0, totalParque - controladasCount);
                                    document.getElementById(`pendientes-${id}`).textContent = pendientes;
                                } else {
                                    document.getElementById(`controladas-${id}`).textContent = 0;
                                    document.getElementById(`pendientes-${id}`).textContent = totalParque;
                                }
                            },
                            error: function() {
                                document.getElementById(`controladas-${id}`).textContent = 0;
                                document.getElementById(`pendientes-${id}`).textContent = totalParque;
                            }
                        });

                    } else {
                        document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                        document.getElementById(`total-${id}`).textContent = 0;
                        document.getElementById(`controladas-${id}`).textContent = 0;
                        document.getElementById(`pendientes-${id}`).textContent = 0;
                    }
                },
                error: function() {
                    document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                    document.getElementById(`total-${id}`).textContent = 0;
                    document.getElementById(`controladas-${id}`).textContent = 0;
                    document.getElementById(`pendientes-${id}`).textContent = 0;
                }
            });
        }

        // Búsqueda en tiempo real
        function filterLines() {
            const query = document.getElementById("lineSearch").value.trim().toLowerCase();
            const cards = document.querySelectorAll(".line-card");
            let visibleCount = 0;

            cards.forEach(card => {
                const num = card.getAttribute("data-linea");
                const empEl = card.querySelector("h3");
                const empText = empEl ? empEl.textContent.toLowerCase() : "";

                if (num.includes(query) || `linea ${num}`.includes(query) || empText.includes(query)) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            const noResults = document.getElementById("noResults");
            if (visibleCount === 0) {
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
            }
        }

        // Modo Oscuro
        function toggleDarkMode() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-xs';
                themeText.textContent = 'Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-xs';
                themeText.textContent = 'Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs';
            document.getElementById('themeText').textContent = 'Claro';
        }
    </script>
</body>
</html>
