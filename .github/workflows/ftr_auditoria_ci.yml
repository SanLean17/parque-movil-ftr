name: FTR - Validación integral sin fuentes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ftr/auditoria-work-20261021, ftr/verificacion-integral-063, ftr/cliente-0631-completo, ftr/historial-fuera-parque, ftr/actualizacion-unica, ftr/agenda-recuperacion-verificable]
    paths:
      - '**.py'
      - '**.js'
      - '**.cjs'
      - '**.html'
      - '.github/workflows/**'
      - '!.github/workflows/ftr_extraordinarias.yml'
      - '_ftr_config.json'
      - '_ftr_app/windows-release.json'
permissions:
  contents: read
jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar solicitud de entrega Windows
        if: runner.os == 'Windows'
        id: client_scope
        run: python _ftr_tools/client_build_scope.py
      - name: Instalar dependencias sin credenciales de fuentes
        run: python -m pip install pytest pandas requests flask 'cryptography>=44,<49' tzdata pyyaml -r _ftr_pruebas/requirements.txt
      - name: Fuentes ficticias, agenda, publicación y contrato 06.3
        env:
          LOCALAPPDATA: ${{ runner.temp }}/ftr-test-user
        run: python -m pytest -q -p no:cacheprovider _ftr_runtime _ftr_pruebas _ftr_admin _ftr_app
      - name: Comparación web y funciones del panel
        run: node --test _ftr_runtime/test_public_web.cjs _ftr_panel/test_modelo_panel05.cjs _ftr_runtime/test_history.cjs
      - name: Contratos de producción y datos intactos
        run: python _ftr_tools/validar_repositorio.py
      - name: Preparar navegador de pruebas
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Web móvil y escritorio con datos ficticios
        if: runner.os == 'Linux'
        run: python _ftr_runtime/browser_public_smoke.py
      - name: Estadísticas públicas, temas, períodos y privacidad
        if: runner.os == 'Linux'
        run: python _ftr_runtime/browser_statistics.py
      - name: Navegación pública, accesibilidad y fechas operativas
        if: runner.os == 'Linux'
        run: python _ftr_runtime/browser_navigation.py
      - name: Panel original, cola y reapertura sin fuentes
        if: runner.os == 'Linux'
        run: python _ftr_tools/check_panel.py
      - name: Historial público con archivos conservados y casos ficticios
        if: runner.os == 'Linux'
        run: python _ftr_runtime/browser_history.py
      - name: Compilar y comprobar cliente Windows sin fuentes
        if: runner.os == 'Windows' && steps.client_scope.outputs.package == 'true'
        run: |
          python -m pip install 'pyinstaller>=6,<7' playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falló instalar compilador.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falló preparar navegador.' }
          python _ftr_tools/package_client.py --version-file build/windows-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falló validar versión.' }
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --paths . --collect-all tzdata --version-file build/windows-version.txt --name FTR_Administracion _ftr_app/main0631.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló compilar cliente.' }
          python _ftr_tools/package_client.py dist/FTR_Administracion.exe dist/FTR_Administracion_06_3_9_Windows
          if ($LASTEXITCODE -ne 0) { throw 'Falló preparar paquete completo.' }
          python _ftr_tools/check_client_build.py dist/FTR_Administracion_06_3_9_Windows/FTR_Administracion.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falló probar binario.' }
          python _ftr_tools/zip_client.py dist/FTR_Administracion_06_3_9_Windows
          if ($LASTEXITCODE -ne 0) { throw 'Falló generar ZIP.' }
      - name: Conservar paquete Windows completo comprobado
        if: runner.os == 'Windows' && steps.client_scope.outputs.package == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ftr-cliente-0639-completo-comprobado
          path: dist/FTR_Administracion_06_3_9_Windows.zip
          retention-days: 7
          if-no-files-found: error
