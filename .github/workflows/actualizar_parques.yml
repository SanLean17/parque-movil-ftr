import os
import requests
import re

# Diccionario de Línea -> Código de Empresa CNRT
# (Si la línea comparte empresa con otra, se usa el mismo código de empresa)
EMPRESAS_CNRT = {
    2: 2,
    9: 9,
    10: 102,
    15: 15,
    17: 17,
    22: 22,
    24: 24,
    29: 29,
    32: 32,
    33: 33,
    37: 37,
    45: 45,   # Comparte con 119 y 154
    51: 51,
    53: 53,
    56: 56,
    60: 60,
    63: 63,
    70: 70,
    74: 74,
    75: 75,
    79: 79,
    80: 80,
    85: 85,
    91: 91,
    92: 92,
    98: 98,
    100: 100,
    113: 113,
    119: 45,  # Misma empresa que Línea 45
    126: 126,
    128: 128,
    129: 129,
    133: 133,
    134: 134,
    135: 135,
    148: 148,
    154: 45,  # Misma empresa que Línea 45
    158: 158,
    159: 159,
    160: 160,
    164: 164,
    168: 168,
    177: 177,
    178: 178,
    179: 179,
    180: 180,
    195: 195,
    197: 197
}

OUTPUT_DIR = "parques"
os.makedirs(OUTPUT_DIR, exist_ok=True)

headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
}

session = requests.Session()

def descargar_parque(linea, cod_empresa):
    file_destino = os.path.join(OUTPUT_DIR, f"linea{linea}.csv")
    print(f"--- Procesando Línea {linea} (Cod Empresa: {cod_empresa}) ---")
    
    try:
        # URL oficial donde la CNRT genera la exportación directa de VehiculosPasajeros.csv
        url_export = f"https://consultapme.cnrt.gob.ar/vehiculos_habilitados/exportar_csv?empresa={cod_empresa}"
        
        resp = session.get(url_export, headers=headers, timeout=20)
        
        if resp.status_code == 200 and len(resp.text) > 100:
            # Guardamos el contenido de VehiculosPasajeros.csv renombrado como lineaX.csv
            with open(file_destino, 'w', encoding='utf-8') as f:
                f.write(resp.text)
            print(f"✅ Descargado exitosamente: linea{linea}.csv ({len(resp.text)} bytes)")
        else:
            print(f"⚠️ No se obtuvieron datos válidos para la Línea {linea} (Status: {resp.status_code})")
            
    except Exception as e:
        print(f"❌ Error al descargar Línea {linea}: {e}")

if __name__ == "__main__":
    for linea, cod_empresa in EMPRESAS_CNRT.items():
        descargar_parque(linea, cod_empresa)
