name: Actualizador Mensual de Parques CNRT

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías y Navegador
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Ejecutar descargador de parques
        run: |
          python actualizar_parques.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "Bot Parque Móvil"
          git config --global user.email "bot@parquemovil.local"
          git add parques/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de parques CNRT [skip ci]" && git push)
