<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea 22 - Parque Móvil FTR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Centrado -->
    <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-md py-3 px-4 border-b dark:border-gray-700 relative">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="bg-blue-800 hover:bg-blue-700 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-2 rounded-lg text-white transition text-sm font-bold flex items-center space-x-2 shadow-sm" title="Volver a Líneas">
                <i class="fa-solid fa-arrow-left text-base"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>

            <div class="text-center flex-grow mx-2">
                <h1 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-white leading-tight">LÍNEA 22</h1>
                <p class="text-blue-200 dark:text-gray-400 text-[11px] hidden sm:block">Parque Móvil Oficial</p>
            </div>
            
            <button onclick="toggleDarkMode()" class="bg-blue-800 dark:bg-gray-700 text-yellow-300 dark:text-yellow-400 p-2 sm:px-3 rounded-lg border border-blue-700 dark:border-gray-600 hover:bg-blue-700 dark:hover:bg-gray-600 transition text-xs font-bold flex items-center space-x-1" title="Cambiar tema">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                <span id="themeText" class="text-[10px] hidden sm:inline">Oscuro</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 flex-grow w-full">

        <!-- Tarjetas de Filtro Rápido -->
        <div class="grid grid-cols-3 gap-2 mb-3">
            <button onclick="setFilter('ALL')" id="btnFilterAll" class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border-2 border-blue-600 dark:border-blue-500 text-center transition">
                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">Total</p>
                <p class="text-base sm:text-lg font-black text-blue-900 dark:text-blue-300" id="countTotal">0</p>
            </button>
            <button onclick="setFilter('CONTROLADO')" id="btnFilterControlado" class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center transition">
                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">Controlados</p>
                <p class="text-base sm:text-lg font-black text-green-600 dark:text-green-400" id="countControlados">0</p>
            </button>
            <button onclick="setFilter('PENDIENTE')" id="btnFilterPendiente" class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center transition">
                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">Pendientes</p>
                <p class="text-base sm:text-lg font-black text-gray-600 dark:text-gray-300" id="countPendientes">0</p>
            </button>
        </div>

        <!-- Buscador + Botón Copiar Faltantes -->
        <div class="mb-3 bg-white dark:bg-gray-800 p-2.5 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row gap-2 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Buscar por Interno o Patente..." 
                    class="w-full pl-9 pr-3 py-1.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs">
            </div>

            <button onclick="copyMissing()" class="w-full sm:w-auto bg-blue-800 hover:bg-blue-900 text-white text-xs px-3 py-2 rounded-md font-semibold transition flex items-center justify-center space-x-1 shadow-sm">
                <i class="fa-regular fa-copy"></i>
                <span>Copiar Faltantes</span>
            </button>
        </div>

        <!-- Tabla de Parque Móvil -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="fleetTable">
                    <thead>
                        <tr class="bg-gray-800 dark:bg-gray-950 text-white text-[11px] sm:text-xs uppercase tracking-wider text-center divide-x divide-gray-700">
                            <th class="py-2.5 px-2 font-semibold">DOMINIO</th>
                            <th class="py-2.5 px-2 font-semibold">INTERNO</th>
                            <th class="py-2.5 px-2 font-semibold">MODELO (AÑO)</th>
                            <th class="py-2.5 px-2 font-semibold">HABILITADO HASTA</th>
                            <th class="py-2.5 px-2 font-semibold">TÉCNICA VIGENTE HASTA</th>
                            <th class="py-2.5 px-2 font-semibold">N° TÉCNICA</th>
                            <th class="py-2.5 px-2 font-semibold">ÚLTIMA FISCALIZACIÓN</th>
                            <th class="py-2.5 px-2 font-semibold">ESTADO</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-xs font-medium" id="fleetTbody">
                        <tr>
                            <td colspan="8" class="py-6 text-center text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-2.5 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>

    <!-- Scripts -->
    <script>
        // =========================================================================
        // PEGÁ ACÁ TUS DATOS DE GOOGLE SHEETS (SELECCIONÁ LAS 3 COLUMNAS Y PEGÁ)
        // =========================================================================
        const rawControlados = `
03/02/2026	AA556VC	301
01/04/2026	OWG796	302
03/02/2026	NWD145	303
01/09/2026	NWD146	303
01/09/2026	OJH809	304
03/02/2026	NWM384	305
17/07/2026	OIN012	306
17/07/2026	PLJ321	307
18/05/2026	NWM383	309
03/02/2026	NWM386	310
17/07/2026	OTO687	311
01/09/2026	PMX286	312
03/02/2026	PAX143	313
18/05/2026	OIS834	314
18/05/2026	PMX285	315
01/09/2026	PMX284	315
03/02/2026	OVS434	316
01/04/2026	AA383LA	317
01/04/2026	OHJ292	319
18/05/2026	OHJ289	321
01/04/2026	OHJ290	322
03/02/2026	OHJ291	323
17/07/2026	AA040AW	324
01/04/2026	AA383MV	325
01/04/2026	OKJ777	326
01/09/2026	OKJ777	326
01/09/2026	ONV915	327
17/07/2026	OQZ445	330
17/07/2026	ONV913	332
17/07/2026	NWD144	333
18/05/2026	NDW145	336
01/09/2026	NWD145	336
03/02/2026	OMX979	337
01/04/2026	AA356KZ	340
01/04/2026	ONV914	344
17/07/2026	PLJ320	345
01/09/2026	OGI355	346
18/05/2026	AA556VB	348
03/02/2026	PMX285	352
01/04/2026	NWD147	354
18/05/2026	PLJ318	360
18/05/2026	PNN729	362
18/05/2026	AA537ZZ	366
        `;
        // =========================================================================

        let currentStatusFilter = 'ALL';

        // Parsear el bloque de texto en un mapa/diccionario { DOMINIO: FECHA }
        function parseControladosMap(rawText) {
            const map = {};
            const lines = rawText.trim().split("\n");
            
            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 2) {
                    const fecha = parts[0];
                    const dominio = parts[1].toUpperCase();
                    // Guarda la última fecha de fiscalización para cada dominio
                    map[dominio] = fecha;
                }
            });
            return map;
        }

        const mapControlados = parseControladosMap(rawControlados);

        // Cargar y procesar el CSV automáticamente
        Papa.parse("linea22.csv", {
            download: true,
            header: true,
            delimiter: ";",
            skipEmptyLines: true,
            complete: function(results) {
                renderFleet(results.data);
            },
            error: function(err) {
                document.getElementById("fleetTbody").innerHTML = `<tr><td colspan="8" class="py-6 text-center text-red-500 font-bold">Error al cargar 'linea22.csv'. Verificá que el archivo esté subido al repositorio.</td></tr>`;
            }
        });

        function renderFleet(data) {
            data.sort((a, b) => parseInt(a.interno || 0) - parseInt(b.interno || 0));

            let tbody = document.getElementById("fleetTbody");
            tbody.innerHTML = "";

            let total = data.length;
            let countControlados = 0;
            let countPendientes = 0;

            const hoy = new Date().toISOString().split('T')[0];

            data.forEach(item => {
                let dominioCSV = (item.dominio || '').trim().toUpperCase();
                let fechaFiscalizacion = mapControlados[dominioCSV] || null;
                let isControlado = !!fechaFiscalizacion;

                if (isControlado) countControlados++;
                else countPendientes++;

                let statusText = isControlado ? "CONTROLADO" : "PENDIENTE";
                let rowBg = isControlado ? "" : "bg-slate-50 dark:bg-gray-800/60";

                let modeloText = `${item.chasisMarca || ''} ${item.chasisModelo || ''} (${item.anioModelo || ''})`.trim();
                let habHasta = item.vigenciaHasta ? item.vigenciaHasta.replace("UC:", "") : "-";

                // Validar Técnica Vencida
                let tecFecha = item.vigenciaHastaInspeccionTecnica || "-";
                let tecBadgeClass = "bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300";

                if (tecFecha !== "-") {
                    let parts = tecFecha.split("/");
                    if (parts.length === 3) {
                        let formattedFecha = `${parts[2]}-${parts[1]}-${parts[0]}`;
                        if (formattedFecha < hoy) {
                            tecBadgeClass = "bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-300";
                        } else {
                            tecBadgeClass = "bg-green-100 text-green-800 dark:bg-green-900/60 dark:text-green-300";
                        }
                    }
                }

                let tr = document.createElement("tr");
                tr.className = `hover:bg-blue-50 dark:hover:bg-gray-700 transition divide-x divide-gray-200 dark:divide-gray-700 text-center ${rowBg}`;
                tr.setAttribute("data-status", statusText);

                tr.innerHTML = `
                    <td class="py-2.5 px-2 font-black text-gray-900 dark:text-gray-100 font-mono text-sm">${dominioCSV || '-'}</td>
                    <td class="py-2.5 px-2 font-extrabold text-gray-900 dark:text-gray-100 text-sm">${item.interno || '-'}</td>
                    <td class="py-2.5 px-2 text-gray-700 dark:text-gray-300">${modeloText}</td>
                    <td class="py-2.5 px-2 text-gray-600 dark:text-gray-400">${habHasta}</td>
                    <td class="py-2.5 px-2"><span class="${tecBadgeClass} px-2 py-0.5 rounded font-bold text-[10px]">${tecFecha}</span></td>
                    <td class="py-2.5 px-2 text-gray-600 dark:text-gray-400 font-mono">${item.tecnicaNro || '-'}</td>
                    <td class="py-2.5 px-2 font-bold text-gray-800 dark:text-gray-200">${fechaFiscalizacion ? fechaFiscalizacion : '<span class="text-gray-400 font-normal italic">-</span>'}</td>
                    <td class="py-2.5 px-2">
                        <span class="${isControlado ? 'bg-green-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300'} px-2 py-0.5 rounded-full font-bold text-[10px]">
                            ${statusText}
                        </span>
                    </td>
                `;

                tbody.appendChild(tr);
            });

            document.getElementById("countTotal").textContent = total;
            document.getElementById("countControlados").textContent = countControlados;
            document.getElementById("countPendientes").textContent = countPendientes;
        }

        function setFilter(status) {
            currentStatusFilter = status;
            
            const btnAll = document.getElementById('btnFilterAll');
            const btnCtrl = document.getElementById('btnFilterControlado');
            const btnPend = document.getElementById('btnFilterPendiente');

            [btnAll, btnCtrl, btnPend].forEach(btn => {
                btn.classList.remove('border-2', 'border-blue-600', 'dark:border-blue-500');
                btn.classList.add('border-gray-200', 'dark:border-gray-700');
            });

            if (status === 'ALL') btnAll.classList.add('border-2', 'border-blue-600', 'dark:border-blue-500');
            if (status === 'CONTROLADO') btnCtrl.classList.add('border-2', 'border-blue-600', 'dark:border-blue-500');
            if (status === 'PENDIENTE') btnPend.classList.add('border-2', 'border-blue-600', 'dark:border-blue-500');

            applyFilters();
        }

        function applyFilters() {
            let searchInput = document.getElementById("searchInput").value.toUpperCase();
            let tr = document.querySelectorAll("#fleetTbody tr");

            tr.forEach(row => {
                let status = row.getAttribute('data-status');
                if (!status) return;

                let dominio = row.getElementsByTagName("td")[0].textContent.toUpperCase();
                let interno = row.getElementsByTagName("td")[1].textContent.toUpperCase();

                let matchesSearch = (dominio.indexOf(searchInput) > -1 || interno.indexOf(searchInput) > -1);
                let matchesStatus = (currentStatusFilter === 'ALL' || status === currentStatusFilter);

                if (matchesSearch && matchesStatus) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        function copyMissing() {
            let missingInternos = [];
            let tr = document.querySelectorAll("#fleetTbody tr[data-status='PENDIENTE']");

            tr.forEach(row => {
                let interno = row.getElementsByTagName("td")[1].textContent.trim();
                let dominio = row.getElementsByTagName("td")[0].textContent.trim();
                missingInternos.push(`• Int. ${interno} (${dominio})`);
            });

            if (missingInternos.length === 0) {
                alert("¡Excelente! No hay colectivos pendientes de control en esta línea.");
                return;
            }

            let textToCopy = `*LÍNEA 22 - PENDIENTES DE CONTROL (${missingInternos.length} unidades):*\n` + missingInternos.join("\n");

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("¡Copiado al portapapeles!\n\n" + textToCopy);
            }).catch(err => {
                alert("Error al copiar: " + err);
            });
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-sm';
                themeText.textContent = 'Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-sm';
                themeText.textContent = 'Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-sm';
            document.getElementById('themeText').textContent = 'Claro';
        }
    </script>

</body>
</html>
