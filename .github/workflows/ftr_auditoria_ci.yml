name: FTR - Validación integral sin fuentes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ftr/auditoria-work-20261021, ftr/verificacion-integral-063]
    paths:
      - '**.py'
      - '**.js'
      - '**.cjs'
      - '**.html'
      - '.github/workflows/**'
      - '_ftr_config.json'
permissions:
  contents: read
jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias sin credenciales de fuentes
        run: python -m pip install pytest pandas requests flask 'cryptography>=44,<49' tzdata pyyaml -r _ftr_pruebas/requirements.txt
      - name: Fuentes ficticias, agenda, publicación y contrato 06.3
        env:
          LOCALAPPDATA: ${{ runner.temp }}/ftr-test-user
        run: python -m pytest -q -p no:cacheprovider _ftr_runtime _ftr_pruebas _ftr_admin _ftr_app
      - name: Comparación web y funciones del panel
        run: node --test _ftr_runtime/test_public_web.cjs _ftr_panel/test_modelo_panel05.cjs
      - name: Contratos de producción y datos intactos
        run: python _ftr_tools/validar_repositorio.py
      - name: Preparar navegador de pruebas
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Web móvil y escritorio con datos ficticios
        if: runner.os == 'Linux'
        run: python _ftr_runtime/browser_public_smoke.py
      - name: Compilar y comprobar cliente Windows sin fuentes
        if: runner.os == 'Windows'
        run: |
          python -m pip install 'pyinstaller>=6,<7' playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falló instalar compilador.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falló preparar navegador.' }
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --paths . --collect-all tzdata --name FTR_Administracion _ftr_app/main0631.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló compilar cliente.' }
          python _ftr_tools/check_client_build.py dist/FTR_Administracion.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falló probar binario.' }
      - name: Conservar binario comprobado (interfaz completa pendiente)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ftr-cliente-0631-binario-comprobado
          path: dist/FTR_Administracion.exe
          retention-days: 7
          if-no-files-found: error
