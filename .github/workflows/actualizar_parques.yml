name: Actualizador de Parques CNRT

on:

  # Ejecución automática diaria.
  #
  # El script decide si ya pasaron 15 días
  # desde la última actualización real.
  schedule:
    - cron: "0 3 * * *"

  # Permite ejecutarlo manualmente desde:
  # GitHub → Actions → Actualizador de Parques CNRT
  workflow_dispatch:

permissions:
  contents: write


jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. DESCARGAR REPOSITORIO
      # ------------------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. CONFIGURAR PYTHON
      # ------------------------------------------------------

      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # 3. INSTALAR LIBRERÍAS
      # ------------------------------------------------------

      - name: Instalar dependencias
        run: |

          python -m pip install --upgrade pip

          pip install pandas playwright

          playwright install chromium

          playwright install-deps chromium


      # ------------------------------------------------------
      # 4. DESCARGAR DATOS DESDE CNRT
      # ------------------------------------------------------

      - name: Descargar parque desde CNRT
        run: |

          python descargar_cnrt.py


      # ------------------------------------------------------
      # 5. SEPARAR POR LÍNEA
      # ------------------------------------------------------

      - name: Procesar parques por línea
        run: |

          python actualizar_parques.py


      # ------------------------------------------------------
      # 6. MOSTRAR CAMBIOS
      # ------------------------------------------------------

      - name: Mostrar cambios
        run: |

          git status

          git diff --stat


      # ------------------------------------------------------
      # 7. GUARDAR CAMBIOS
      # ------------------------------------------------------

      - name: Guardar cambios en GitHub
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv

          git add controlados/*.csv || true

          git add cnrt/*.csv

          git add cnrt_debug.png || true

          if git diff --staged --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit -m "Bot: actualización CNRT de parques"

            git push

          fi
