name: Actualizar Parque Móvil FTR

# Se conserva el acceso manual habitual. La agenda vive únicamente en
# ftr_sincronizar.yml para que el lector de carpeta anterior no sobrescriba
# los controles obtenidos de la planilla anual activa.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    uses: ./.github/workflows/ftr_sincronizar.yml
    with:
      action: all
    secrets: inherit
