name: Actualizador de Parques CNRT

on:

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Instalar dependencias
        run: |

          python -m pip install --upgrade pip

          pip install pandas playwright

          playwright install chromium

          playwright install-deps chromium


      # ----------------------------------------------------
      # COMPROBAR SI YA PASARON 15 DÍAS
      # ----------------------------------------------------

      - name: Comprobar intervalo de actualización
        id: intervalo
        run: |

          python control_actualizacion.py > intervalo.txt

          cat intervalo.txt

          if grep -q "ACTUALIZAR" intervalo.txt; then

            echo "actualizar=true" >> "$GITHUB_OUTPUT"

          else

            echo "actualizar=false" >> "$GITHUB_OUTPUT"

          fi


      # ----------------------------------------------------
      # DESCARGAR CNRT
      # ----------------------------------------------------

      - name: Descargar parque desde CNRT
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python descargar_cnrt.py


      # ----------------------------------------------------
      # PROCESAR PARQUES
      # ----------------------------------------------------

      - name: Separar vehículos por línea
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python actualizar_parques.py


      # ----------------------------------------------------
      # GUARDAR FECHA
      # ----------------------------------------------------

      - name: Guardar fecha de actualización
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python -c "from control_actualizacion import guardar_fecha; guardar_fecha()"


      # ----------------------------------------------------
      # GUARDAR TODO EN GITHUB
      # ----------------------------------------------------

      - name: Guardar cambios en GitHub
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv

          git add controlados/*.csv || true

          git add cnrt/*.csv

          git add ultima_actualizacion.txt

          git add cnrt_debug.png || true

          if git diff --staged --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit -m "Bot: actualización CNRT de parques"

            git push

          fi


      # ----------------------------------------------------
      # MENSAJE CUANDO TODAVÍA NO CORRESPONDE ACTUALIZAR
      # ----------------------------------------------------

      - name: No corresponde actualizar todavía
        if: steps.intervalo.outputs.actualizar == 'false'
        run: |

          echo "Todavía no pasaron 15 días desde la última actualización."
          echo "No se descargará nuevamente CNRT."
