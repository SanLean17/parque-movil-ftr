name: Actualizar Parque Móvil FTR

on:

  # ==========================================================
  # EJECUCIÓN AUTOMÁTICA DIARIA
  # ==========================================================

  schedule:
    - cron: "0 3 * * *"

  # ==========================================================
  # EJECUCIÓN MANUAL
  #
  # Manual = Drive + CNRT + Parque Móvil
  # siempre.
  # ==========================================================

  workflow_dispatch:


# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: write


jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Descargar repositorio
        uses: actions/checkout@v6


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            openpyxl \
            requests \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib \
            playwright

          playwright install chromium

          playwright install-deps chromium


      # ======================================================
      # LEER GOOGLE DRIVE
      #
      # ESTO SE HACE TODOS LOS DÍAS
      # ======================================================

      - name: Actualizar controles desde Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=============================================="
          echo "ACTUALIZANDO CONTROLADOS DESDE GOOGLE DRIVE"
          echo "=============================================="

          python leer_controlados_drive.py


      # ======================================================
      # DETERMINAR SI TOCA CNRT
      #
      # AUTOMÁTICO:
      #   cada 15 días
      #
      # MANUAL:
      #   siempre
      # ======================================================

      - name: Comprobar actualización CNRT
        id: comprobar_cnrt
        run: |

          echo "=============================================="
          echo "COMPROBANDO ACTUALIZACIÓN CNRT"
          echo "=============================================="

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Ejecución MANUAL detectada."
            echo "CNRT se actualizará obligatoriamente."

            echo "actualizar=true" >> "$GITHUB_OUTPUT"

          else

            python - <<'PY'

          import os

          from control_actualizacion import debe_actualizar


          if debe_actualizar():

              print("Han pasado 15 días o más.")
              print("CNRT debe actualizarse.")

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write("actualizar=true\n")

          else:

              print("Todavía no pasaron 15 días.")
              print("CNRT NO se actualizará.")

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write("actualizar=false\n")

          PY

          fi


      # ======================================================
      # SCRAPER CNRT
      # ======================================================

      - name: Actualizar datos CNRT
        if: steps.comprobar_cnrt.outputs.actualizar == 'true'

        run: |

          echo "=============================================="
          echo "ACTUALIZANDO DATOS CNRT"
          echo "=============================================="

          python scraper.py


      # ======================================================
      # ACTUALIZAR PARQUES
      # ======================================================

      - name: Generar parques por línea
        if: steps.comprobar_cnrt.outputs.actualizar == 'true'

        run: |

          echo "=============================================="
          echo "GENERANDO PARQUES POR LÍNEA"
          echo "=============================================="

          python actualizar_parques.py


      # ======================================================
      # GUARDAR FECHA DE ACTUALIZACIÓN CNRT
      # ======================================================

      - name: Guardar fecha actualización Parque Móvil
        if: steps.comprobar_cnrt.outputs.actualizar == 'true'

        run: |

          python - <<'PY'

          from control_actualizacion import guardar_fecha

          guardar_fecha()

          PY


      # ======================================================
      # VER CAMBIOS
      # ======================================================

      - name: Ver cambios
        run: |

          echo "=============================================="
          echo "CAMBIOS DETECTADOS"
          echo "=============================================="

          git status --short


      # ======================================================
      # COMMIT
      # ======================================================

      - name: Guardar cambios en GitHub
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualización automática Parque Móvil FTR"

            git push

          fi
