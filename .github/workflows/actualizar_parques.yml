name: Actualizador de Parque y Controles

on:

  # ----------------------------------------------------------
  # EJECUCIÓN AUTOMÁTICA
  # ----------------------------------------------------------

  schedule:
    # 06:00 UTC = 03:00 Argentina
    - cron: '0 6 * * *'

  # ----------------------------------------------------------
  # EJECUCIÓN MANUAL
  # ----------------------------------------------------------

  workflow_dispatch:
    inputs:

      forzar_cnrt:
        description: "Actualizar CNRT aunque no hayan pasado 15 días"
        required: true
        default: false
        type: boolean


jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================

      - name: Descargar repositorio

        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.10'


      # ======================================================
      # 3. INSTALAR LIBRERÍAS
      # ======================================================

      - name: Instalar librerías

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. INSTALAR CHROMIUM
      # ======================================================

      - name: Instalar Chromium

        run: |

          python -m playwright install --with-deps chromium


      # ======================================================
      # 5. DRIVE
      #
      # SE EJECUTA TODOS LOS DÍAS
      # ======================================================

      - name: Actualizar controles desde Google Drive

        env:

          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          python leer_controlados_drive.py


      # ======================================================
      # 6. COMPROBAR CNRT
      # ======================================================

      - name: Comprobar si corresponde actualizar CNRT

        id: control

        env:

          FORZAR_CNRT: ${{ inputs.forzar_cnrt }}

        run: |

          if [ "$FORZAR_CNRT" = "true" ]; then

            echo "Actualización CNRT forzada manualmente."

            echo "actualizar=true" >> "$GITHUB_OUTPUT"

          else

            python -c "from control_actualizacion import debe_actualizar; print('actualizar=' + str(debe_actualizar()).lower())" > estado.txt

            cat estado.txt

            if grep -q "actualizar=true" estado.txt; then

              echo "actualizar=true" >> "$GITHUB_OUTPUT"

            else

              echo "actualizar=false" >> "$GITHUB_OUTPUT"

            fi

          fi


      # ======================================================
      # 7. DESCARGAR CNRT
      # ======================================================

      - name: Descargar parques oficiales CNRT

        if: steps.control.outputs.actualizar == 'true'

        run: |

          python scraper.py


      # ======================================================
      # 8. SEPARAR CNRT POR LÍNEA
      # ======================================================

      - name: Filtrar y separar parques por línea

        if: steps.control.outputs.actualizar == 'true'

        run: |

          python actualizar_parques.py


      # ======================================================
      # 9. GUARDAR FECHA CNRT
      # ======================================================

      - name: Guardar fecha de actualización CNRT

        if: steps.control.outputs.actualizar == 'true'

        run: |

          python -c "from control_actualizacion import guardar_fecha; guardar_fecha()"


      # ======================================================
      # 10. GUARDAR CAMBIOS EN GITHUB
      # ======================================================

      - name: Guardar cambios

        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv

          git add controlados/*.csv

          git add ultima_actualizacion.txt

          git diff --staged --quiet || git commit -m "Bot: actualización automática"

          git push
