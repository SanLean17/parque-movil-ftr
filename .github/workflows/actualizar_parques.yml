name: Actualizador de Parque y Controles

on:

  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
          pip install google-api-python-client
          pip install google-auth
          pip install google-auth-httplib2
          pip install google-auth-oauthlib
          pip install requests
          pip install playwright

      - name: Instalar Chromium
        run: |
          playwright install chromium

      # ====================================================
      # DRIVE — TODOS LOS DÍAS
      # ====================================================

      - name: Actualizar controles desde Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python leer_controlados_drive.py

      # ====================================================
      # CNRT — SOLO CUANDO CORRESPONDA
      # ====================================================

      - name: Comprobar si corresponde actualizar CNRT
        id: control
        run: |
          python -c "from control_actualizacion import debe_actualizar; print('actualizar=' + str(debe_actualizar()).lower())" > estado.txt
          cat estado.txt

          if grep -q "actualizar=true" estado.txt; then
            echo "actualizar=true" >> "$GITHUB_OUTPUT"
          else
            echo "actualizar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar parques oficiales CNRT
        if: steps.control.outputs.actualizar == 'true'
        run: |
          python scraper.py

      - name: Filtrar y separar parques por línea
        if: steps.control.outputs.actualizar == 'true'
        run: |
          python actualizar_parques.py

      - name: Guardar fecha de actualización CNRT
        if: steps.control.outputs.actualizar == 'true'
        run: |
          python -c "from control_actualizacion import guardar_fecha; guardar_fecha()"

      # ====================================================
      # GUARDAR CAMBIOS
      # ====================================================

      - name: Guardar cambios
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv
          git add controlados/*.csv
          git add ultima_actualizacion.txt

          git diff --staged --quiet || git commit -m "Bot: actualización automática"

          git push
