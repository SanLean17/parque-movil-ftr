name: Actualizador de Parques CNRT

on:

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Instalar dependencias
        run: |

          python -m pip install --upgrade pip

          pip install pandas playwright

          playwright install chromium

          playwright install-deps chromium


      # ====================================================
      # DETERMINAR SI ES EJECUCIÓN MANUAL
      # ====================================================

      - name: Comprobar intervalo de 15 días
        id: intervalo
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "actualizar=true" >> "$GITHUB_OUTPUT"

            echo "Ejecución manual: se fuerza actualización."

          else

            python control_actualizacion.py > intervalo.txt

            cat intervalo.txt

            if grep -q "ACTUALIZAR" intervalo.txt; then

              echo "actualizar=true" >> "$GITHUB_OUTPUT"

            else

              echo "actualizar=false" >> "$GITHUB_OUTPUT"

            fi

          fi


      # ====================================================
      # DESCARGAR CNRT
      # ====================================================

      - name: Descargar parque desde CNRT
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python descargar_cnrt.py


      # ====================================================
      # SEPARAR POR LÍNEA
      # ====================================================

      - name: Procesar parques por línea
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python actualizar_parques.py


      # ====================================================
      # GUARDAR FECHA
      # ====================================================

      - name: Guardar fecha de actualización
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          python -c "from control_actualizacion import guardar_fecha; guardar_fecha()"


      # ====================================================
      # GUARDAR CAMBIOS
      # ====================================================

      - name: Guardar cambios en GitHub
        if: steps.intervalo.outputs.actualizar == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv

          git add controlados/*.csv || true

          git add cnrt/*.csv

          git add ultima_actualizacion.txt

          git add cnrt_debug.png || true

          if git diff --staged --quiet; then

            echo "No hay cambios."

          else

            git commit -m "Bot: actualización CNRT de parques"

            git push

          fi


      # ====================================================
      # NO ACTUALIZAR
      # ====================================================

      - name: Esperar hasta la próxima actualización
        if: steps.intervalo.outputs.actualizar == 'false'
        run: |

          echo "Todavía no han pasado 15 días."

          echo "No se modifica el parque móvil."
