<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Móvil FTR - Resumen General</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Fuente JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        code: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Compacto Mobile -->
    <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-md py-2.5 px-3 border-b dark:border-gray-700">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bus-simple text-lg text-blue-300"></i>
                <div>
                    <h1 class="text-base sm:text-xl font-black uppercase tracking-wider text-white leading-tight">Parque Móvil FTR</h1>
                    <p class="text-blue-200 dark:text-gray-400 text-[9px] sm:text-xs">Sistema de Fiscalización de Transporte</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="bg-blue-800 dark:bg-gray-700 text-yellow-300 dark:text-yellow-400 p-1.5 sm:px-2.5 rounded-lg border border-blue-700 dark:border-gray-600 hover:bg-blue-700 dark:hover:bg-gray-600 transition text-xs font-bold flex items-center space-x-1">
                <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
                <span id="themeText" class="text-[10px] hidden sm:inline">Oscuro</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-3 sm:py-5 flex-grow w-full">
        
        <!-- Buscador y Título -->
        <div class="mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
                <h2 class="text-sm sm:text-lg font-black text-gray-800 dark:text-gray-200 uppercase tracking-wide">Estado General de Líneas</h2>
            </div>

            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="lineSearch" onkeyup="filterTable()" placeholder="Buscar por línea o empresa..." 
                    class="w-full pl-8 pr-3 py-1.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs font-code shadow-sm">
            </div>
        </div>

        <!-- ESTRUCTURA DE TABLA EN COLUMNAS OPTIMIZADA -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="bg-gray-50 dark:bg-gray-700/60 text-gray-600 dark:text-gray-300 text-[10px] sm:text-xs font-black uppercase tracking-wider border-b border-gray-200 dark:border-gray-700">
                        <th class="py-2.5 px-3 text-center">N° Emp.</th>
                        <th class="py-2.5 px-3">LÍNEA</th>
                        <th class="py-2.5 px-3">RAZÓN SOCIAL</th>
                        <th class="py-2.5 px-3 text-center">Unidades<br>Totales</th>
                        <th class="py-2.5 px-3 text-center">Unidades<br>Controladas</th>
                        <th class="py-2.5 px-3 text-center">% Fiscaliz.</th>
                        <th class="py-2.5 px-3 text-center">Última<br>Visita</th>
                        <th class="py-2.5 px-3 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="linesTableBody" class="divide-y divide-gray-100 dark:divide-gray-700/50 text-xs font-medium">
                    <!-- Filas generadas dinámicamente -->
                </tbody>
            </table>
        </div>

        <div id="noResults" class="hidden text-center py-10 text-gray-400">
            <i class="fa-solid fa-bus text-3xl mb-1 opacity-40"></i>
            <p class="text-xs font-semibold">No se encontraron líneas coincidentes</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-2 text-center text-[10px] mt-auto border-t border-gray-700">
        Parque Móvil FTR &copy; 2026
    </footer>

    <script>
        // Tu listado completo de líneas ordenado de menor a mayor
        const lineas = [
            2, 9, 10, 15, 17, 22, 24, 29, 32, 33, 37, 45, 51, 53, 56, 60, 63, 70, 74, 75, 
            79, 80, 85, 91, 92, 98, 100, 113, 119, 126, 128, 129, 133, 134, 135, 148, 154, 
            158, 159, 160, 164, 168, 177, 178, 179, 180, 195, 197
        ].sort((a, b) => a - b);

        const tbody = document.getElementById("linesTableBody");

        // Helper para leer propiedades del CSV
        function getProp(obj, names) {
            const keys = Object.keys(obj);
            for (let name of names) {
                const found = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
                if (found && obj[found] !== null && obj[found] !== undefined) return String(obj[found]).trim();
            }
            return '';
        }

        // Generar filas de la tabla
        lineas.forEach((id, index) => {
            const tr = document.createElement("tr");
            tr.className = "line-row hover:bg-blue-50/50 dark:hover:bg-gray-700/40 transition";
            tr.setAttribute("data-linea", id);

            tr.innerHTML = `
                <!-- N° EMP. -->
                <td class="py-2.5 px-3 text-center font-code text-gray-400 dark:text-gray-500 text-[11px]">
                    ${index + 1}
                </td>

                <!-- LÍNEA -->
                <td class="py-2.5 px-3 font-black text-gray-900 dark:text-gray-100 font-code whitespace-nowrap">
                    <span class="bg-blue-100 dark:bg-blue-900/50 text-blue-900 dark:text-blue-300 px-2 py-0.5 rounded">
                        LÍNEA ${id}
                    </span>
                </td>

                <!-- RAZÓN SOCIAL -->
                <td class="py-2.5 px-3 font-bold text-gray-700 dark:text-gray-200 uppercase truncate max-w-[180px]" id="empresa-${id}">
                    Cargando...
                </td>

                <!-- UNIDADES TOTALES -->
                <td class="py-2.5 px-3 text-center font-code font-bold text-gray-800 dark:text-gray-100" id="total-${id}">
                    -
                </td>

                <!-- UNIDADES CONTROLADAS -->
                <td class="py-2.5 px-3 text-center font-code font-bold text-green-600 dark:text-green-400" id="controladas-${id}">
                    -
                </td>

                <!-- % FISCALIZADO -->
                <td class="py-2.5 px-3 text-center font-code font-bold text-blue-600 dark:text-blue-400" id="porcentaje-${id}">
                    -
                </td>

                <!-- ÚLTIMA VISITA -->
                <td class="py-2.5 px-3 text-center font-code text-[11px] text-gray-500 dark:text-gray-400 whitespace-nowrap" id="visita-${id}">
                    -
                </td>

                <!-- ACCIÓN -->
                <td class="py-2.5 px-3 text-center whitespace-nowrap">
                    <a href="linea.html?id=${id}" class="bg-blue-800 hover:bg-blue-900 text-white text-[11px] px-2.5 py-1 rounded-md font-bold transition inline-flex items-center space-x-1 shadow-sm">
                        <span>Ver</span>
                        <i class="fa-solid fa-chevron-right text-[9px]"></i>
                    </a>
                </td>
            `;

            tbody.appendChild(tr);
            cargarDatosLinea(id);
        });

        // Lectura e integración de CSV (Parques + Controlados)
        function cargarDatosLinea(id) {
            Papa.parse(`parques/linea${id}.csv`, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(resParque) {
                    let totalParque = 0;
                    if (resParque && resParque.data) {
                        const parqueData = resParque.data;
                        totalParque = parqueData.length;
                        document.getElementById(`total-${id}`).textContent = totalParque;

                        if (totalParque > 0) {
                            let emp = getProp(parqueData[0], ['empresa', 'razonsocial', 'razon_social', 'nombre_empresa', 'empresa_nombre', 'razonSocial']);
                            document.getElementById(`empresa-${id}`).textContent = emp || `EMPRESA LÍNEA ${id}`;
                        } else {
                            document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                        }

                        // Cargar Inspecciones Controladas
                        Papa.parse(`controlados/linea${id}.csv`, {
                            download: true,
                            header: true,
                            skipEmptyLines: true,
                            complete: function(resControl) {
                                if (resControl && resControl.data) {
                                    const controlData = resControl.data;
                                    const dominiosControlados = new Set();
                                    let ultimaFecha = '';

                                    controlData.forEach(row => {
                                        let dom = getProp(row, ['dominio', 'patente', 'carroceria_dominio', 'dominos']);
                                        if (dom) dominiosControlados.add(dom.toUpperCase());

                                        let fecha = getProp(row, ['fecha', 'fechas', 'fecha_control']);
                                        if (fecha && fecha > ultimaFecha) ultimaFecha = fecha;
                                    });

                                    const controladasCount = dominiosControlados.size;
                                    document.getElementById(`controladas-${id}`).textContent = controladasCount;

                                    // Cálculo de % Fiscalizado
                                    if (totalParque > 0) {
                                        const pct = Math.round((controladasCount / totalParque) * 100);
                                        document.getElementById(`porcentaje-${id}`).textContent = `${pct}%`;
                                    } else {
                                        document.getElementById(`porcentaje-${id}`).textContent = '0%';
                                    }

                                    // Última visita
                                    document.getElementById(`visita-${id}`).textContent = ultimaFecha || 'Sin registros';

                                } else {
                                    document.getElementById(`controladas-${id}`).textContent = 0;
                                    document.getElementById(`porcentaje-${id}`).textContent = '0%';
                                    document.getElementById(`visita-${id}`).textContent = 'Sin registros';
                                }
                            },
                            error: function() {
                                document.getElementById(`controladas-${id}`).textContent = 0;
                                document.getElementById(`porcentaje-${id}`).textContent = '0%';
                                document.getElementById(`visita-${id}`).textContent = 'Sin registros';
                            }
                        });

                    } else {
                        document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                        document.getElementById(`total-${id}`).textContent = 0;
                        document.getElementById(`controladas-${id}`).textContent = 0;
                        document.getElementById(`porcentaje-${id}`).textContent = '0%';
                        document.getElementById(`visita-${id}`).textContent = 'Sin registros';
                    }
                },
                error: function() {
                    document.getElementById(`empresa-${id}`).textContent = `EMPRESA LÍNEA ${id}`;
                    document.getElementById(`total-${id}`).textContent = 0;
                    document.getElementById(`controladas-${id}`).textContent = 0;
                    document.getElementById(`porcentaje-${id}`).textContent = '0%';
                    document.getElementById(`visita-${id}`).textContent = 'Sin registros';
                }
            });
        }

        // Búsqueda en tiempo real sobre las filas de la tabla
        function filterTable() {
            const query = document.getElementById("lineSearch").value.trim().toLowerCase();
            const rows = document.querySelectorAll(".line-row");
            let visibleCount = 0;

            rows.forEach(row => {
                const num = row.getAttribute("data-linea");
                const empEl = row.querySelector(`#empresa-${num}`);
                const empText = empEl ? empEl.textContent.toLowerCase() : "";

                if (num.includes(query) || `linea ${num}`.includes(query) || empText.includes(query)) {
                    row.style.display = "";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            });

            const noResults = document.getElementById("noResults");
            if (visibleCount === 0) {
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
            }
        }

        // Modo Oscuro
        function toggleDarkMode() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-xs';
                themeText.textContent = 'Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-xs';
                themeText.textContent = 'Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs';
            document.getElementById('themeText').textContent = 'Claro';
        }
    </script>
</body>
</html>
