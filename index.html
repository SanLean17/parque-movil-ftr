<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTADO GENERAL DE LÍNEAS - Parque Móvil FTR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-3 md:p-6 transition-colors duration-200">

  <div class="max-w-6xl mx-auto">
    <!-- Encabezado -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide flex items-center gap-2">
          <span>🚍</span> ESTADO GENERAL DE LÍNEAS
        </h1>
        <p class="text-xs text-gray-400 mt-1">Parque Móvil FTR — Control y Fiscalización</p>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <!-- Buscador -->
        <div class="relative flex-1 md:w-64">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar línea, empresa..." 
            class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 pl-9 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500"
          >
          <span class="absolute left-3 top-2.5 text-gray-400 text-sm">🔍</span>
        </div>

        <!-- Toggle Modo Oscuro / Claro -->
        <button 
          id="themeToggle" 
          class="bg-gray-800 hover:bg-gray-700 text-gray-200 p-2 rounded-lg border border-gray-700 transition-colors"
          title="Cambiar tema"
        >
          🌙
        </button>
      </div>
    </header>

    <!-- Tarjetas de Resumen General -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
        <span class="text-xs text-gray-400 block">Total Líneas</span>
        <span id="statLines" class="text-xl font-bold font-mono text-blue-400">0</span>
      </div>
      <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
        <span class="text-xs text-gray-400 block">Parque Total</span>
        <span id="statTotalUnits" class="text-xl font-bold font-mono text-gray-200">0</span>
      </div>
      <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
        <span class="text-xs text-gray-400 block">Fiscalizados</span>
        <span id="statControlled" class="text-xl font-bold font-mono text-green-400">0</span>
      </div>
      <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
        <span class="text-xs text-gray-400 block">Avance General</span>
        <span id="statProgress" class="text-xl font-bold font-mono text-yellow-400">0%</span>
      </div>
    </div>

    <!-- Tabla de Líneas -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden shadow-lg">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-900/80 text-gray-400 uppercase text-xs border-b border-gray-700">
            <tr>
              <th scope="col" class="px-4 py-3">Línea</th>
              <th scope="col" class="px-4 py-3">Razón Social / Empresa</th>
              <th scope="col" class="px-4 py-3 text-center">Total</th>
              <th scope="col" class="px-4 py-3 text-center">Controlados</th>
              <th scope="col" class="px-4 py-3 text-center">% Avance</th>
              <th scope="col" class="px-4 py-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="linesTableBody" class="divide-y divide-gray-700/50">
            <!-- Cargando... -->
            <tr id="loadingRow">
              <td colspan="6" class="text-center py-8 text-gray-400">
                Procesando información de las líneas...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Líneas a procesar
    const LINES_CONFIG = [
      { line: "148", companyCode: "100", name: "EL NUEVO HALCON S.A." },
      // Agregá acá tus líneas adicionales o conectá dinámicamente
    ];

    async function fetchCSV(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) return null;
        return await res.text();
      } catch (e) {
        return null;
      }
    }

    function parseCSVCount(csvText) {
      if (!csvText) return 0;
      const lines = csvText.trim().split('\n').filter(l => l.trim() !== '');
      return Math.max(0, lines.length - 1); // Descuenta encabezado
    }

    async function loadDashboard() {
      const tableBody = document.getElementById('linesTableBody');
      tableBody.innerHTML = '';

      let totalParqueGeneral = 0;
      let totalControladosGeneral = 0;
      let linesProcessed = 0;

      for (const item of LINES_CONFIG) {
        const parqueCsv = await fetchCSV(`./parques/linea_${item.line}.csv`);
        const controlCsv = await fetchCSV(`./controlados/linea_${item.line}.csv`);

        const totalUnits = parseCSVCount(parqueCsv);
        const controlledUnits = parseCSVCount(controlCsv);
        const pct = totalUnits > 0 ? ((controlledUnits / totalUnits) * 100).toFixed(1) : '0.0';

        totalParqueGeneral += totalUnits;
        totalControladosGeneral += controlledUnits;
        linesProcessed++;

        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-700/40 transition-colors line-row';
        row.innerHTML = `
          <td class="px-4 py-3 font-bold font-mono text-white text-base">Línea ${item.line}</td>
          <td class="px-4 py-3 text-gray-300">
            <span class="text-xs text-gray-400 block font-mono">Cód: ${item.companyCode}</span>
            ${item.name}
          </td>
          <td class="px-4 py-3 text-center font-mono text-gray-200">${totalUnits}</td>
          <td class="px-4 py-3 text-center font-mono text-green-400 font-semibold">${controlledUnits}</td>
          <td class="px-4 py-3 text-center">
            <span class="inline-block px-2 py-1 text-xs rounded-full font-mono ${
              pct >= 80 ? 'bg-green-900/60 text-green-300' :
              pct >= 40 ? 'bg-yellow-900/60 text-yellow-300' :
              'bg-red-900/60 text-red-300'
            }">
              ${pct}%
            </span>
          </td>
          <td class="px-4 py-3 text-center">
            <a href="./linea_${item.line}.html" class="inline-block bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition-colors">
              Ver Detalle
            </a>
          </td>
        `;
        tableBody.appendChild(row);
      }

      // Actualizar Métricas Superiores
      document.getElementById('statLines').textContent = linesProcessed;
      document.getElementById('statTotalUnits').textContent = totalParqueGeneral;
      document.getElementById('statControlled').textContent = totalControladosGeneral;
      const totalPct = totalParqueGeneral > 0 ? ((totalControladosGeneral / totalParqueGeneral) * 100).toFixed(1) : '0.0';
      document.getElementById('statProgress').textContent = `${totalPct}%`;
    }

    // Buscador en tiempo real
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('.line-row');
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
      });
    });

    // Toggle de Modo Oscuro / Claro
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeToggle.textContent = document.documentElement.classList.contains('dark') ? '🌙' : '☀️';
    });

    // Iniciar
    loadDashboard();
  </script>
</body>
</html>
