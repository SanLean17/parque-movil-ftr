name: FTR - Pruebas agenda 06.2 (sin actualizar datos)
on:
  push:
    branches: [ftr/correccion-agenda-062]
    paths:
      - _ftr_app/**
      - _ftr_runtime/**
      - _ftr_tools/**
      - .github/workflows/ftr_sincronizar.yml
      - .github/workflows/ftr_agenda_pruebas062.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependencias de pruebas, sin credenciales de fuentes
        run: python -m pip install --disable-pip-version-check 'Flask>=3.1,<4' requests -r _ftr_tools/requirements-security.txt tzdata 'pyinstaller>=6,<7' playwright pyyaml
      - name: Pruebas de agenda, guardado sin lectura y estados del panel
        run: |
          python -m unittest discover -s _ftr_runtime -p 'test_*.py' -v
          python -m unittest discover -s _ftr_app -p 'test_*.py' -v
      - name: Verificar que aplicar cambios no dispara una actualización
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import yaml
          data = yaml.load(Path('.github/workflows/ftr_sincronizar.yml').read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          assert 'push' not in data['on']
          assert data['on']['schedule'][0]['cron'] == '7,22,37,52 * * * *'
          print('Sin disparo de fuentes por push. Solo agenda y solicitudes autorizadas.')
          '@ | python -
      - name: Instalar navegador de prueba
        run: python -m playwright install chromium
      - name: Compilar aplicación local 06.2
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --paths . --collect-all tzdata --name FTR_Administracion _ftr_app/agenda_bridge.py
      - name: Probar ejecutable por HTTP y DPAPI
        shell: pwsh
        run: |
          '<html><body>Prueba interna __FTR_CSRF__</body></html>' | Set-Content -Encoding utf8 dist/panel.html
          $p = Start-Process -FilePath ./dist/FTR_Administracion.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path ./dist/self-test-ok.txt)) { throw 'Falló el inicio del ejecutable.' }
      - name: Repetir navegación real con la versión 06.2
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('_ftr_app/browser_smoke061.py').resolve()
          source = path.read_text(encoding='utf-8').replace('06.1', '06.2')
          exec(compile(source, str(path), 'exec'), {'__file__': str(path), '__name__': '__main__'})
          '@ | python -
      - name: Preparar comprobantes y fuentes sin datos privados
        shell: pwsh
        run: |
          Remove-Item ./dist/panel.html -ErrorAction SilentlyContinue
          git archive --format=zip -o dist/ftr-fuentes-062.zip HEAD _ftr_app _ftr_runtime _ftr_tools _ftr_config.json .github/workflows/ftr_sincronizar.yml
          'Pruebas con datos ficticios. Sin Google, CNRT ni publicación de controles.' | Set-Content -Encoding utf8 dist/ALCANCE_PRUEBA.txt
      - name: Conservar ejecutable y resultados
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ftr-programa-windows-062
          path: |
            dist/FTR_Administracion.exe
            dist/self-test-ok.txt
            dist/COMPROBACION_NAVEGADOR.json
            dist/ALCANCE_PRUEBA.txt
            dist/ftr-fuentes-062.zip
          if-no-files-found: error
          retention-days: 7
