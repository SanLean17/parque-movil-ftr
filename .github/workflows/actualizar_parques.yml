name: Actualizador de Parque y Controles

on:

  # Ejecutar todos los días a las 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # DESCARGAR REPOSITORIO
      # ------------------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ------------------------------------------------------
      # INSTALAR DEPENDENCIAS
      # ------------------------------------------------------

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
          pip install google-api-python-client
          pip install google-auth
          pip install google-auth-httplib2
          pip install google-auth-oauthlib
          pip install requests
          pip install playwright

      # ------------------------------------------------------
      # PLAYWRIGHT
      # ------------------------------------------------------

      - name: Instalar Chromium
        run: |
          playwright install chromium

      # ------------------------------------------------------
      # GOOGLE DRIVE
      # ------------------------------------------------------

      - name: Actualizar controles desde Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python leer_controlados_drive.py

      # ------------------------------------------------------
      # CNRT
      # ------------------------------------------------------

      - name: Descargar parques oficiales CNRT
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scraper.py

      # ------------------------------------------------------
      # SEPARAR POR LÍNEA
      # ------------------------------------------------------

      - name: Filtrar y separar parques por línea
        run: |
          python actualizar_parques.py

      # ------------------------------------------------------
      # GUARDAR CAMBIOS
      # ------------------------------------------------------

      - name: Guardar cambios
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parques/*.csv
          git add controlados/*.csv

          git diff --staged --quiet || git commit -m "Bot: actualización CNRT y controles"

          git push
